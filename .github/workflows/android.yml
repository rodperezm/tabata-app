name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar app web con Android
        run: npx cap sync android

      - name: Dar permiso de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK de prueba (se instala directo en un teléfono Android)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Compilar paquete AAB (formato que pide Google Play)
        working-directory: android
        run: ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: tabata-android-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tabata-android-aab-sin-firmar
          path: android/app/build/outputs/bundle/release/*.aab
