<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabata</title>
<meta name="theme-color" content="#F0EEE9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tabata">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0EEE9;--fg:#1E2233;--bar:#E3E0D9;--card:#FFFFFF;--mut:#5d6075;--bd:#d3cfc6;--n1:#2F6FA8;--n2:#6f7710;
--f:"Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171B2B;--fg:#F0EEE9;--bar:#10131F;--card:#222845;--mut:#a3a7bd;--bd:#343b60;--n1:#6FA6D6;--n2:#CBD33A}}
:root[data-theme="dark"]{--bg:#171B2B;--fg:#F0EEE9;--bar:#10131F;--card:#222845;--mut:#a3a7bd;--bd:#343b60;--n1:#6FA6D6;--n2:#CBD33A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
.head{position:relative;text-align:center;padding:10px 16px 8px;font-family:var(--f);flex:none}
.head .t{font-size:30px;line-height:1;letter-spacing:.04em}
.head .tot{font-size:40px;line-height:1.05;color:var(--n2)}
#reset{position:absolute;right:14px;top:14px;width:44px;height:44px;border-radius:50%;border:2px solid var(--n2);background:transparent;color:var(--n2);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.screen{flex:1;min-height:0;display:none;flex-direction:column}
.screen.on{display:flex}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f);text-align:center;transition:background .2s}
#phase{font-size:clamp(44px,14vw,76px);line-height:1;letter-spacing:.02em;text-transform:uppercase}
#time{font-size:clamp(130px,44vw,230px);line-height:.95;font-variant-numeric:tabular-nums}
#next{flex:none;text-align:center;font-family:var(--f);padding:10px 0 12px}
#next .l{font-size:34px;line-height:1;text-transform:uppercase}
#next .v{font-size:76px;line-height:1}
.ctl{flex:none;background:var(--bar);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:14px 12px 12px;font-family:var(--f);text-align:center}
.ctl .n{font-size:84px;line-height:1}
.ctl .c{font-size:22px;line-height:1.05;text-transform:uppercase}
#go{width:104px;height:104px;border-radius:50%;border:0;background:#CBD33A;color:#1E2233;display:flex;align-items:center;justify-content:center;cursor:pointer;margin:0 auto;padding:0;box-shadow:inset 0 0 0 5px #CBD33A,inset 0 0 0 8px #1E2233}
#golbl{font-size:34px;line-height:1;margin-top:6px;color:var(--n2)}
#cfg{padding:12px 16px 16px;overflow-y:auto}
#cfg h2{font-family:var(--f);font-size:38px;margin:4px 0 12px;font-weight:400;letter-spacing:.03em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.row .n{font-size:15px;line-height:1.2;flex:1}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--bar);color:var(--fg);font-size:22px;line-height:1;cursor:pointer;padding:0}
.step input{width:64px;text-align:center;border:0;background:transparent;color:var(--fg);font-family:var(--f);font-size:34px;outline:none;padding:0}
.test{width:100%;border:1px solid var(--bd);background:transparent;color:var(--fg);border-radius:14px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px}
.hint{color:var(--mut);font-size:13px;margin:10px 2px 0}
.tabs{flex:none;background:var(--bar);display:flex;justify-content:center;gap:10px;padding:8px 12px 10px;border-top:1px solid var(--bd)}
.tab{flex:1;max-width:190px;border:0;background:transparent;color:var(--fg);font-family:var(--f);font-size:20px;letter-spacing:.03em;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;border-radius:26px;cursor:pointer;text-transform:uppercase}
.tab.on{background:var(--fg);color:var(--bar)}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="t">TABATA</div>
    <div class="tot" id="tot">00:00</div>
    <button id="reset" aria-label="Reiniciar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
  </div>

  <div class="screen on" id="home">
    <div id="stage"><div id="phase">Listo</div><div id="time">00:00</div></div>
    <div id="next"><div class="l" id="nl">Entrenar</div><div class="v" id="nv">00:20</div></div>
    <div class="ctl">
      <div><div class="n" id="n1" style="color:var(--n1)">4</div><div class="c">Rondas<br>restantes</div></div>
      <div><button id="go" aria-label="Empezar"></button><div id="golbl">Empezar</div></div>
      <div><div class="n" id="n2" style="color:var(--n2)">8</div><div class="c">Ejercicios<br>restantes</div></div>
    </div>
  </div>

  <div class="screen" id="cfg">
    <h2>Configurar</h2>
    <div id="rows"></div>
    <button class="test" id="test">🔊 Probar sonido</button>
    <p class="hint">Pon 0 en cualquier tiempo opcional para saltarlo. Los cambios se guardan solos y se aplican al pulsar Empezar en Inicio.</p>
  </div>

  <div class="tabs">
    <button class="tab on" id="tabH"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>Inicio</button>
    <button class="tab" id="tabC"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Configurar</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const DEF = {R:4,E:8,W:20,D:10,RR:30,P:10,C:60};
const META = [['R','Rondas',1,99],['E','Ejercicios por ronda',1,99],['W','Ejecución por ejercicio (seg)',1,600],['D','Descanso entre ejercicios (seg)',0,600],['RR','Descanso entre rondas (seg)',0,600],['P','Cuenta antes de partir (seg)',0,120],['C','Enfriamiento al final (seg)',0,900]];
let cfg = {...DEF};
try{ const s = JSON.parse(localStorage.getItem('tabata_cfg')||'null'); if(s) cfg = {...DEF,...s}; }catch(e){}
function save(){ try{ localStorage.setItem('tabata_cfg', JSON.stringify(cfg)); }catch(e){} }

/* Colores: paleta Pantone 2026 (Cloud Dancer, Acacia, Teaberry, Neptune Green, Dutch Canal, Burnished Lilac, Evening Blue) */
const COL = {idle:['#F0EEE9','#1E2233'],prep:['#CBD33A','#1E2233'],work:['#CF2B58','#FFFFFF'],rest:['#6DB89B','#1E2233'],rr:['#6FA6D6','#1E2233'],cool:['#C6B4D6','#1E2233'],done:['#6DB89B','#1E2233']};
const NAME = {idle:'Listo',prep:'Prepárate',work:'¡Entrena!',rest:'Descanso',rr:'Descanso de ronda',cool:'Enfriamiento',done:'¡Lo lograste!'};
const NEXTL = {prep:'Prepárate',work:'Entrenar',rest:'Descanso',rr:'Descanso de ronda',cool:'Enfriamiento'};

/* ---------- Audio ---------- */
let ac, keep, tk = 0;
function silentSrc(){
  const n=8000, v=new DataView(new ArrayBuffer(44+n));
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
  let s='';for(let i=0;i<44+n;i++){ if(i>=44) v.setUint8(i,128); s+=String.fromCharCode(v.getUint8(i)); }
  return 'data:audio/wav;base64,'+btoa(s);
}
function audio(){
  try{ if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)(); if(ac.state!=='running') ac.resume(); }catch(e){}
  try{ if(!keep){ keep = new Audio(silentSrc()); keep.loop = true; } keep.play().catch(()=>{}); }catch(e){}
  try{ speechSynthesis.getVoices(); }catch(e){}
}
function beep(freq, dur, vol, type){
  if(!ac) return;
  try{
    if(ac.state!=='running') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type||'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
function tick(){ tk++; if(tk%2) beep(1500,0.07,0.6,'triangle'); else beep(950,0.09,0.6,'triangle'); }
function say(txt){
  try{
    const u = new SpeechSynthesisUtterance(txt); u.lang='es-ES'; u.volume=1;
    const v = speechSynthesis.getVoices().find(x=>/^es/i.test(x.lang)); if(v) u.voice = v;
    if(speechSynthesis.speaking) speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- Lógica ---------- */
let phases = [], idx = 0, left = 0, timer = null, state = 'idle'; // idle | run | paused | done
const fmt = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
function build(){
  const {R,E,W,D,P,RR,C} = cfg, p = [];
  if(P>0) p.push({k:'prep', t:P});
  for(let r=1;r<=R;r++){
    for(let e=1;e<=E;e++){
      p.push({k:'work', t:W, r, e, first:(r===1&&e===1)});
      if(e<E && D>0) p.push({k:'rest', t:D, r, e});
    }
    if(r<R && RR>0) p.push({k:'rr', t:RR, r});
  }
  if(C>0) p.push({k:'cool', t:C});
  return p;
}
function paint(el, k){ el.style.background = COL[k][0]; el.style.color = COL[k][1]; }
const ICON_PLAY = '<svg width="52" height="52" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
const ICON_PAUSE = '<svg width="52" height="52" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1"/><rect x="13.8" y="5" width="4.2" height="14" rx="1"/></svg>';
const ICON_AGAIN = '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>';

function render(){
  let k, t, nk = null, nt = 0, r1 = cfg.R, e1 = cfg.E, total = 0, lbl = '';
  if(state==='idle'){
    const list = build(); k = 'idle'; t = list[0].t;
    const w = list.find(x=>x.k==='work'); nk = (list[0].k==='prep') ? 'work' : null; nt = cfg.W;
    total = list.reduce((a,x)=>a+x.t,0);
    if(list[0].k==='work'){ nk = null; }
    lbl = 'Empezar';
  } else if(state==='done'){
    k = 'done'; t = 0; r1 = 0; e1 = 0; total = phases.reduce((a,x)=>a+x.t,0); lbl = 'Reiniciar';
  } else {
    const ph = phases[idx]; k = ph.k; t = left;
    const nx = phases[idx+1]; if(nx){ nk = nx.k; nt = nx.t; }
    total = left; for(let i=idx+1;i<phases.length;i++) total += phases[i].t;
    if(k==='work'){ r1 = cfg.R-ph.r+1; e1 = cfg.E-ph.e+1; }
    else if(k==='rest'){ r1 = cfg.R-ph.r+1; e1 = cfg.E-ph.e; }
    else if(k==='rr'){ r1 = cfg.R-ph.r; e1 = cfg.E; }
    else if(k==='cool'){ r1 = 0; e1 = 0; }
    lbl = state==='paused' ? 'Continuar' : 'Pausar';
  }
  paint($('stage'), k);
  $('phase').textContent = (state==='paused') ? 'En pausa' : NAME[k];
  $('time').textContent = fmt(t);
  $('tot').textContent = fmt(total);
  const nx = $('next');
  if(state==='done'){ paint(nx,'done'); $('nl').textContent = 'Duración total'; $('nv').textContent = fmt(total); }
  else if(nk){ paint(nx, nk); $('nl').textContent = NEXTL[nk]; $('nv').textContent = fmt(nt); }
  else if(state==='idle'){ paint(nx,'work'); $('nl').textContent = NEXTL.work; $('nv').textContent = fmt(cfg.W); }
  else { paint(nx,'done'); $('nl').textContent = 'Último tramo'; $('nv').textContent = fmt(left); }
  $('n1').textContent = r1; $('n2').textContent = e1;
  $('golbl').textContent = lbl;
  $('go').innerHTML = (state==='run') ? ICON_PAUSE : (state==='done' ? ICON_AGAIN : ICON_PLAY);
  $('go').setAttribute('aria-label', lbl);
}
/* ---------- Pista de audio completa ----------
   Todo el entrenamiento (tic-tac, pitidos, avisos) se genera como un solo audio
   y se reproduce como audio de medios. Así sigue sonando con la pantalla bloqueada
   y el tiempo se lee del propio audio, que no se detiene en segundo plano. */
const SR = 8000, MAX_TRACK = 2400;               // 8 kHz; hasta 40 minutos
let starts = [], total = 0, useTrack = false, trackAudio = null, trackURL = null, base = 0, t0 = 0;

function plan(){
  phases = build(); starts = []; let a = 0;
  phases.forEach(p => { starts.push(a); a += p.t; });
  total = a;
}
function wavBlob(samples){
  const n = samples.length, b = new ArrayBuffer(44 + n*2), v = new DataView(b);
  const w = (o,s) => { for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVEfmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,SR,true); v.setUint32(28,SR*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true);
  new Int16Array(b, 44).set(samples);
  return new Blob([b], {type:'audio/wav'});
}
function addTone(buf, at, freq, dur, vol, tri){
  const s0 = Math.round(at*SR), n = Math.round(dur*SR), k = Math.pow(0.0001/vol, 1/n);
  let env = vol;
  for(let i=0;i<n;i++){
    const j = s0 + i; if(j<0 || j>=buf.length) break;
    const ph = 2*Math.PI*freq*i/SR;
    const x = tri ? (2/Math.PI)*Math.asin(Math.sin(ph)) : Math.sin(ph);
    const y = buf[j] + x*env*(i<16 ? i/16 : 1)*30000;
    buf[j] = y>32767 ? 32767 : (y<-32768 ? -32768 : y);
    env *= k;
  }
}
function buildTrack(){
  if(total > MAX_TRACK) return null;             // muy largo: se usa el modo en vivo
  const buf = new Int16Array(Math.ceil((total + 2)*SR));
  let c = 0;
  phases.forEach((ph, i) => {
    const s = starts[i];
    if(ph.k==='work') addTone(buf, s, 880, .5, .5);
    else if(ph.k!=='prep') addTone(buf, s, 500, .4, .4);
    if(ph.first) addTone(buf, s+.45, 1175, .35, .5);      // aviso de "¡Vamos!"
    for(let k=1;k<ph.t;k++){
      if(ph.t-k <= 3) addTone(buf, s+k, 700, .12, .45);   // últimos 3 segundos
      else { c++; if(c%2) addTone(buf, s+k, 1500, .07, .6, true); else addTone(buf, s+k, 950, .09, .6, true); }
    }
  });
  addTone(buf, total, 660, .2, .5); addTone(buf, total+.22, 880, .2, .5); addTone(buf, total+.44, 1100, .5, .5);  // ¡Lo lograste!
  return URL.createObjectURL(wavBlob(buf));
}

/* ---------- Pantalla encendida y controles de bloqueo ---------- */
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const NOSLEEP_SRC = 'data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAM0bW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAB9AAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAl50cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAB9AAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAEAAAABAAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAAAfQAAAAAAABAAAAAAHWbWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAABAAAAAgABVxAAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAABWaWRlb0hhbmRsZXIAAAABgW1pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAAUFzdGJsAAAAuXN0c2QAAAAAAAAAAQAAAKlhdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAEAAQABIAAAASAAAAAAAAAABFUxhdmM2MC4zMS4xMDIgbGlieDI2NAAAAAAAAAAAAAAAGP//AAAAL2F2Y0MBQsAe/+EAF2dCwB7ZBCbARAAAAwAEAAADABA8WLkgAQAFaMuDyyAAAAAQcGFzcAAAAAEAAAABAAAAFGJ0cnQAAAAAAAAKuAAACrgAAAAYc3R0cwAAAAAAAAABAAAABAAAIAAAAAAUc3RzcwAAAAAAAAABAAAAAQAAABxzdHNjAAAAAAAAAAEAAAABAAAABAAAAAEAAAAkc3RzegAAAAAAAAAAAAAABAAAAo8AAAAKAAAACwAAAAoAAAAUc3RjbwAAAAAAAAABAAADZAAAAGJ1ZHRhAAAAWm1ldGEAAAAAAAAAIWhkbHIAAAAAAAAAAG1kaXJhcHBsAAAAAAAAAAAAAAAALWlsc3QAAAAlqXRvbwAAAB1kYXRhAAAAAQAAAABMYXZmNjAuMTYuMTAwAAAACGZyZWUAAAK2bWRhdAAAAnAGBf//bNxF6b3m2Ui3lizYINkj7u94MjY0IC0gY29yZSAxNjQgcjMxMDggMzFlMTlmOSAtIEguMjY0L01QRUctNCBBVkMgY29kZWMgLSBDb3B5bGVmdCAyMDAzLTIwMjMgLSBodHRwOi8vd3d3LnZpZGVvbGFuLm9yZy94MjY0Lmh0bWwgLSBvcHRpb25zOiBjYWJhYz0wIHJlZj0zIGRlYmxvY2s9MTowOjAgYW5hbHlzZT0weDE6MHgxMTEgbWU9aGV4IHN1Ym1lPTcgcHN5PTEgcHN5X3JkPTEuMDA6MC4wMCBtaXhlZF9yZWY9MSBtZV9yYW5nZT0xNiBjaHJvbWFfbWU9MSB0cmVsbGlzPTEgOHg4ZGN0PTAgY3FtPTAgZGVhZHpvbmU9MjEsMTEgZmFzdF9wc2tpcD0xIGNocm9tYV9xcF9vZmZzZXQ9LTIgdGhyZWFkcz0yIGxvb2thaGVhZF90aHJlYWRzPTEgc2xpY2VkX3RocmVhZHM9MCBucj0wIGRlY2ltYXRlPTEgaW50ZXJsYWNlZD0wIGJsdXJheV9jb21wYXQ9MCBjb25zdHJhaW5lZF9pbnRyYT0wIGJmcmFtZXM9MCB3ZWlnaHRwPTAga2V5aW50PTI1MCBrZXlpbnRfbWluPTIgc2NlbmVjdXQ9NDAgaW50cmFfcmVmcmVzaD0wIHJjX2xvb2thaGVhZD00MCByYz1jcmYgbWJ0cmVlPTEgY3JmPTIzLjAgcWNvbXA9MC42MCBxcG1pbj0wIHFwbWF4PTY5IHFwc3RlcD00IGlwX3JhdGlvPTEuNDAgYXE9MToxLjAwAIAAAAAXZYiEBTyYoAA/vycnJ1111111111114AAAAAGQZo4CnhGAAAAB0GaVAKeEYAAAAAGQZpgEvCM';
let wl = null, nosleep = null;
async function lockScreen(){
  try{                                            // respaldo para iPhone (video mudo en bucle)
    if(IS_IOS){
      if(!nosleep){
        nosleep = document.createElement('video');
        nosleep.setAttribute('playsinline',''); nosleep.setAttribute('muted',''); nosleep.muted = true; nosleep.loop = true;
        nosleep.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:.01;pointer-events:none';
        nosleep.src = NOSLEEP_SRC; document.body.appendChild(nosleep);
      }
      nosleep.play().catch(()=>{});
    }
  }catch(e){}
  try{
    if('wakeLock' in navigator && !wl){
      wl = await navigator.wakeLock.request('screen');
      wl.addEventListener('release', () => { wl = null; });
    }
  }catch(e){ wl = null; }
}
function unlockScreen(){
  try{ wl && wl.release(); }catch(e){} wl = null;
  try{ nosleep && nosleep.pause(); }catch(e){}
}
function setMedia(){
  if(!('mediaSession' in navigator)) return;
  try{
    let title = 'Tabata', artist = '';
    if(state==='done'){ title = '¡Lo lograste!'; }
    else if(state==='run' || state==='paused'){
      const ph = phases[idx]; title = NAME[ph.k];
      if(ph.k==='work') artist = 'Ronda '+ph.r+'/'+cfg.R+' · Ejercicio '+ph.e+'/'+cfg.E;
      else if(ph.k==='rest') artist = 'Siguiente: ejercicio '+(ph.e+1);
      else if(ph.k==='rr') artist = 'Siguiente: ronda '+(ph.r+1);
    }
    navigator.mediaSession.metadata = new MediaMetadata({
      title, artist, album:'Tabata',
      artwork:[{src:new URL('icons/icon-512.png', location.href).href, sizes:'512x512', type:'image/png'}]
    });
    navigator.mediaSession.playbackState = state==='run' ? 'playing' : (state==='paused' ? 'paused' : 'none');
  }catch(e){}
}
if('mediaSession' in navigator){
  try{
    navigator.mediaSession.setActionHandler('play', () => resumeRun());
    navigator.mediaSession.setActionHandler('pause', () => pauseRun());
  }catch(e){}
}

/* ---------- Reloj y ciclo del entrenamiento ---------- */
function elapsed(){
  if(useTrack && trackAudio) return trackAudio.currentTime;
  return base + (state==='run' ? (performance.now() - t0)/1000 : 0);
}
function liveSound(changedPhase){                 // solo en modo en vivo (sin pista)
  const ph = phases[idx];
  if(changedPhase){ if(ph.k==='work') beep(880,0.5,0.5); else if(ph.k!=='prep') beep(500,0.4,0.4); }
  else if(left<=3) beep(700,0.12,0.45); else tick();
}
function onPhase(){
  const ph = phases[idx];
  if(ph.first && document.visibilityState==='visible' && elapsed()-starts[idx] < 2) say('¡Vamos!');
}
function loop(){
  if(state!=='run') return;
  const e = elapsed();
  if(e >= total){ finish(e); return; }
  let i = idx;
  while(i < phases.length-1 && e >= starts[i] + phases[i].t) i++;
  const rem = Math.max(1, Math.ceil(starts[i] + phases[i].t - e - 1e-6));
  if(i!==idx || rem!==left){
    const changed = i!==idx;
    idx = i; left = rem;
    if(!useTrack) liveSound(changed);
    if(changed){ onPhase(); setMedia(); }
    render();
  }
}
function finish(e){
  if(e===undefined) e = elapsed();
  clearInterval(timer); timer = null; state = 'done'; unlockScreen();
  if(!useTrack){ beep(660,0.2,0.5); setTimeout(()=>beep(880,0.2,0.5),220); setTimeout(()=>beep(1100,0.5,0.5),440); }
  if(document.visibilityState==='visible' && e < total + 1) say('¡Lo lograste!');
  setMedia(); render();
}
function dropTrack(){
  if(trackAudio){ try{ trackAudio.pause(); trackAudio.removeAttribute('src'); trackAudio.load(); }catch(e){} trackAudio = null; }
  if(trackURL){ try{ URL.revokeObjectURL(trackURL); }catch(e){} trackURL = null; }
  useTrack = false;
}
async function startRun(){
  audio(); lockScreen(); plan(); dropTrack();
  state = 'run'; idx = 0; left = phases[0].t; base = 0;
  const url = buildTrack();
  if(url){
    trackURL = url;
    const a = new Audio(url); a.preload = 'auto';
    a.addEventListener('pause', () => { if(state==='run' && !a.ended && a.currentTime < total) pauseRun(); });  // pausa desde la pantalla de bloqueo
    a.addEventListener('play',  () => { if(state==='paused') resumeRun(); });
    trackAudio = a;
    try{ await a.play(); useTrack = true; try{ keep && keep.pause(); }catch(e){} }
    catch(e){ trackAudio = null; try{ URL.revokeObjectURL(url); }catch(e2){} trackURL = null; }
  }
  if(state!=='run') return;                       // el usuario salió mientras cargaba
  if(!useTrack) t0 = performance.now();
  clearInterval(timer); timer = setInterval(loop, 100);
  if(!useTrack) liveSound(true);
  onPhase(); setMedia(); render();
}
function pauseRun(){
  if(state!=='run') return;
  if(!useTrack) base = elapsed();
  state = 'paused';
  if(useTrack && trackAudio) trackAudio.pause();
  unlockScreen(); setMedia(); render();
}
function resumeRun(){
  if(state!=='paused') return;
  audio(); state = 'run';
  if(useTrack && trackAudio){ try{ keep && keep.pause(); }catch(e){} if(trackAudio.paused) trackAudio.play().catch(()=>{}); }
  else t0 = performance.now();
  lockScreen(); setMedia(); render();
}
function stopAll(){
  clearInterval(timer); timer = null; state = 'idle';
  try{ speechSynthesis.cancel(); }catch(e){}
  dropTrack(); unlockScreen();
  try{ keep && keep.pause(); }catch(e){}
  if('mediaSession' in navigator){ try{ navigator.mediaSession.metadata = null; navigator.mediaSession.playbackState = 'none'; }catch(e){} }
  render();
}
document.addEventListener('visibilitychange', () => {   // al volver a la app: sincronizar y recuperar pantalla encendida
  if(document.visibilityState==='visible' && state==='run'){ lockScreen(); loop(); }
});
window.addEventListener('pageshow', () => { if(state==='run') loop(); });
$('go').onclick = () => {
  if(state==='idle') startRun();
  else if(state==='run') pauseRun();
  else if(state==='paused') resumeRun();
  else if(state==='done') stopAll();
};
$('reset').onclick = stopAll;

/* ---------- Pestañas ---------- */
function show(which){
  $('home').classList.toggle('on', which==='home');
  $('cfg').classList.toggle('on', which==='cfg');
  $('tabH').classList.toggle('on', which==='home');
  $('tabC').classList.toggle('on', which==='cfg');
  if(which==='cfg' && state==='run') pauseRun();
}
$('tabH').onclick = () => show('home');
$('tabC').onclick = () => show('cfg');

/* ---------- Configuración ---------- */
const rows = $('rows');
META.forEach(([key,name,min,max]) => {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = '<div class="n">'+name+'</div><div class="step"><button type="button" aria-label="Menos">−</button><input type="number" inputmode="numeric" min="'+min+'" max="'+max+'"><button type="button" aria-label="Más">+</button></div>';
  const [bm, , bp] = [row.querySelectorAll('button')[0], 0, row.querySelectorAll('button')[1]];
  const inp = row.querySelector('input'); inp.value = cfg[key];
  const set = v => {
    v = parseInt(v); if(isNaN(v)) v = cfg[key];
    v = Math.min(max, Math.max(min, v)); cfg[key] = v; inp.value = v; save();
    if(state==='idle') render();
  };
  const bump = d => set((parseInt(inp.value)||0) + d);
  bm.onclick = () => bump(key==='R'||key==='E' ? -1 : (key==='W'||key==='D' ? -5 : -5));
  bp.onclick = () => bump(key==='R'||key==='E' ? 1 : 5);
  inp.onchange = () => set(inp.value);
  rows.appendChild(row);
});
$('test').onclick = () => { audio(); beep(880,0.4,0.6); setTimeout(tick,500); setTimeout(tick,1000); setTimeout(()=>say('¡Vamos!'),1400); };

render();

/* Modo sin internet (solo en la versión web, no dentro de la app nativa) */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', () => { try{ navigator.serviceWorker.register('sw.js'); }catch(e){} });
}
</script>
